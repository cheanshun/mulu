<title>玄学选股 · 四法合参</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;

  }
  .wrap { max-width:960px; margin:0 auto; padding:0 20px; }
  header {
    text-align:center; padding:44px 0 8px;
  }
  header .kick { font-size:13px; letter-spacing:6px; color:#c9a86a; margin-bottom:10px; }
  header h1 { font-size:30px; font-weight:700; letter-spacing:3px; color:#f5efe0; }
  header .sub { margin-top:10px; font-size:14px; color:#9aa3b5; }
  header .meta { margin-top:6px; font-size:12px; color:#6d7686; }
  .card {
    background:linear-gradient(180deg,rgba(30,38,64,.85),rgba(18,23,40,.9));
    border:1px solid rgba(201,168,106,.25);
    border-radius:12px; padding:22px 24px; margin-top:22px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .form-row { display:flex; gap:12px; flex-wrap:wrap; }
  input[type=text] {
    flex:1; min-width:220px; padding:13px 16px; font-size:16px;
    background:rgba(8,12,24,.7); border:1px solid rgba(201,168,106,.35);
    border-radius:8px; color:#f0ecdf; outline:none;
  }
  input[type=text]:focus { border-color:#c9a86a; box-shadow:0 0 0 3px rgba(201,168,106,.15); }
  button {
    padding:13px 34px; font-size:16px; letter-spacing:4px; font-weight:700;
    color:#141014; background:linear-gradient(135deg,#e3c184,#c9a86a);
    border:none; border-radius:8px; cursor:pointer; transition:.2s;
  }
  button:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .hint { font-size:12px; color:#7c8595; margin-top:12px; line-height:1.7; }
  .result { display:none; }
  .result.show { display:block; }
  .total-box {
    display:flex; align-items:center; gap:26px; flex-wrap:wrap;
    padding:18px 22px; border-radius:10px;
    background:rgba(201,168,106,.08); border:1px solid rgba(201,168,106,.3);
  }
  .ring { position:relative; width:110px; height:110px; flex:none; }
  .ring svg { transform:rotate(-90deg); }
  .ring .num { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .num b { font-size:28px; color:#f0e6cd; }
  .ring .num span { font-size:11px; color:#8a93a5; }
  .total-txt { flex:1; min-width:260px; }
  .total-txt .lv { font-size:20px; font-weight:700; color:#e3c184; margin-bottom:6px; }
  .total-txt p { font-size:13.5px; color:#b9bfcc; line-height:1.85; }
  .rank { font-size:13px; color:#9aa3b5; margin-top:6px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:18px; }
  @media (max-width:720px){ .grid { grid-template-columns:1fr; } }
  .mcard {
    background:rgba(10,14,26,.75); border:1px solid rgba(201,168,106,.2);
    border-radius:10px; padding:16px 18px;
  }
  .mcard-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .mcard-title { font-size:16px; font-weight:700; color:#e8e2d2; }
  .mcard-title small { font-size:12px; font-weight:400; color:#8a93a5; margin-left:8px; letter-spacing:1px; }
  .badge { font-size:12px; padding:3px 10px; border-radius:20px; border:1px solid; }
  .badge.ji { color:#7ee2a8; border-color:rgba(126,226,168,.4); background:rgba(126,226,168,.08); }
  .badge.pianji { color:#e3c184; border-color:rgba(227,193,132,.4); background:rgba(227,193,132,.08); }
  .badge.zhong { color:#c9cfdc; border-color:rgba(201,207,220,.35); background:rgba(201,207,220,.07); }
  .badge.xiong { color:#f28b82; border-color:rgba(242,139,130,.4); background:rgba(242,139,130,.08); }
  .score-line { height:5px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; margin-bottom:10px; }
  .score-line i { display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,#c9a86a,#e3c184); }
  .tag { display:inline-block; font-size:12.5px; color:#c3c9d6; background:rgba(201,168,106,.1); border:1px solid rgba(201,168,106,.22); border-radius:5px; padding:2px 8px; margin:0 6px 6px 0; }
  ul.note-list { list-style:none; margin-top:6px; }
  ul.note-list li { position:relative; padding-left:14px; font-size:13px; color:#b4bac8; line-height:1.8; }
  ul.note-list li::before { content:""; position:absolute; left:2px; top:10px; width:5px; height:5px; border-radius:50%; background:#c9a86a; }
  .foot { text-align:center; margin-top:26px; font-size:12px; color:#6d7686; line-height:1.9; }
  .foot .warn { color:#8a93a5; }
</style>

<div class="wrap">
  <header>

    <div class="sub">雷诺曼 · 塔罗 · 六爻 · 奇门，四法测算买入 / 持有 / 卖出</div>
    <div class="meta">制作者：车坤德 · 单网页独立版</div>
  </header>

  <div class="card">
    <div class="form-row">
      <input type="text" id="code" placeholder="如 600519 / 000001 / 00700" maxlength="20">
      <button id="go">测 算</button>
    </div>
    <div class="hint">输入股票代码（支持 A股 6/0/3 开头、港股 0/1 开头、美股字母代码）。同一代码同日测算结果一致，跨日自然更新；换代码则六爻动爻与奇门股票落宫随之改变，结果各不相同。</div>
  </div>

  <div class="result" id="result">
    <div class="card total-box">
      <div class="ring" id="ring"></div>
      <div class="total-txt">
        <div class="lv" id="t-level"></div>
        <p id="t-advice"></p>
        <div class="rank" id="t-rank"></div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="foot">
    <div class="warn">本测算依玄学推演而成，仅供文化娱乐参考，不构成任何投资建议。市场有风险，决策需谨慎。</div>

  </div>

/* ============ 工具 ============ */
function crc32(str){
  var c, crc = 0xFFFFFFFF;
  for (var i = 0; i < str.length; i++){
    c = str.charCodeAt(i);
    crc = crc ^ c;
    for (var k = 0; k < 8; k++) crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rndInt(rnd, n){ return Math.floor(rnd() * n); }
function mod8(n){ var r = n % 8; return r === 0 ? 8 : r; }

function pad(n){ return n < 10 ? '0' + n : '' + n; }

/* ============ 农历 / 节气（移植自 PHP） ============ */
function lunarLeapMonth(y){ return D.LUNAR_INFO[y - 1900] & 0xf; }
function lunarLeapDays(y){ return lunarLeapMonth(y) ? ((D.LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0; }
function lunarMonthDays(y, m){ return (D.LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
function lunarYearDays(y){
  var sum = 348;
  for (var i = 0x8000; i > 0x8; i >>= 1) if (D.LUNAR_INFO[y - 1900] & i) sum += 1;
  return sum + lunarLeapDays(y);
}
function lunarToChinaDay(d2){
  if (d2 === 10) return '初十';
  if (d2 === 20) return '二十';
  if (d2 === 30) return '三十';
  return D.N2[Math.floor(d2 / 10)] + D.N1[d2 % 10];
}
function solar2lunar(y, m, d2){
  if (y < 1900 || y > 2100) return null;
  var offset = Math.round((Date.UTC(y, m - 1, d2) - Date.UTC(1900, 0, 31)) / 86400000);
  var i = 1900, temp = 0;
  while (i < 2101 && offset > 0){ temp = lunarYearDays(i); offset -= temp; i++; }
  if (offset < 0){ offset += temp; i--; }
  var year = i;
  var leap = lunarLeapMonth(year);
  var isLeap = false;
  i = 1;
  while (i < 13 && offset > 0){
    if (leap > 0 && i === (leap + 1) && !isLeap){ --i; isLeap = true; temp = lunarLeapDays(year); }
    else temp = lunarMonthDays(year, i);
    if (isLeap && i === (leap + 1)) isLeap = false;
    offset -= temp; i++;
  }
  if (offset === 0 && leap > 0 && i === leap + 1){
    if (isLeap) isLeap = false; else { isLeap = true; --i; }
  }
  if (offset < 0){ offset += temp; --i; }
  var month = i, day = offset + 1;
  var gzDay = Math.round((Date.UTC(y, m - 1, d2) - Date.UTC(1900, 0, 1)) / 86400000) + 10;
  var g = ((year - 3) % 10 + 10) % 10, z = ((year - 3) % 12 + 12) % 12;
  return {
    lYear: year, lMonth: month, lDay: day, isLeap: isLeap,
    gzYear: D.GAN[(g + 9) % 10] + D.ZHI[(z + 11) % 12],
    gzDay: ((gzDay % 60) + 60) % 60,
    animal: ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'][((year - 4) % 12 + 12) % 12]
  };
}
function sTermDate(y, n){
  var ms = 31556925974.7 * (y - 1900) + D.sTermInfo[n] * 60000 + Date.UTC(1900, 0, 6, 2, 5);
  var dt = new Date(Math.floor(ms / 1000) * 1000);
  return { month: dt.getUTCMonth() + 1, day: dt.getUTCDate() };
}
function monthZhiByDate(y, m, d){
  var val = m * 100 + d;
  var last = { idx: 11 };
  var cands = [{y:y-1,n:22},{y:y-1,n:23}];
  for (var n = 0; n < 24; n++) cands.push({y:y,n:n});
  for (var i = 0; i < cands.length; i++){
    var t = sTermDate(cands[i].y, cands[i].n);
    if (t.month * 100 + t.day <= val) last = { idx: D.ST_MONTH[cands[i].n], t: t };
  }
  return last;
}
function kongwang(gzDay){
  var xunStart = gzDay - gzDay % 10;
  return [D.ZHI[(xunStart + 10) % 12], D.ZHI[(xunStart + 11) % 12]];
}
function elemStrength(elem, monthElem, dayElem){
  var score = 0;
  if ((D.SHENG[monthElem] || null) === elem) score += 2;
  else if (monthElem === elem) score += 2;
  else if ((D.KE[monthElem] || null) === elem) score -= 2;
  else if ((D.SHENG[elem] || null) === monthElem) score -= 1;
  if ((D.SHENG[dayElem] || null) === elem) score += 1;
  else if (dayElem === elem) score += 1;
  else if ((D.KE[dayElem] || null) === elem) score -= 1;
  if (score >= 3) return { lv:'wang', label:'旺相得力' };
  if (score >= 1) return { lv:'ping', label:'中和有气' };
  return { lv:'shuai', label:'休囚无力' };
}

/* ============ 六爻起卦 ============ */
function triToNum(tri){

}
function yaoToGua(yao){
  return { up: triToNum([yao[3],yao[4],yao[5]]), down: triToNum([yao[0],yao[1],yao[2]]) };
}
function guaToYao(up, down){
  return D.BAGUA[down].tri.concat(D.BAGUA[up].tri);
}
function liuqin(gongElem, zhiElem){
  if (gongElem === zhiElem) return '兄弟';
  if ((D.SHENG[gongElem]||null) === zhiElem) return '子孙';
  if ((D.SHENG[zhiElem]||null) === gongElem) return '父母';
  if ((D.KE[gongElem]||null) === zhiElem) return '妻财';
  return '官鬼';
}
function guaNajia(up, down){
  var nUp = D.NAJIA[up], nDown = D.NAJIA[down], arr = [];
  for (var i = 0; i < 6; i++){
    if (i >= 3) arr.push({ gan: nUp.og[i-3], zhi: nUp.oz[i-3] });
    else arr.push({ gan: nDown.ig[i], zhi: nDown.iz[i] });
  }
  return arr;
}
function guaLiuqin(gongElem, yao, najiaArr){
  var out = [];
  for (var i = 0; i < 6; i++) out.push(liuqin(gongElem, D.ZHI_ELEM[najiaArr[i].zhi]));
  return out;
}
function getFushen(cast){
  var gong = cast.ben.g;
  var sk = {乾:11,兑:22,离:33,震:44,巽:55,坎:66,艮:77,坤:88}[gong];
  var su = Math.floor(sk / 10), sd = sk % 10;
  var sYao = guaToYao(su, sd);
  var sNj = guaNajia(su, sd);
  var sLq = guaLiuqin(D.GONG_ELEM[gong], sYao, sNj);
  var benNj = guaNajia(cast.up, cast.down);
  var benLq = guaLiuqin(D.GONG_ELEM[gong], cast.yao, benNj);
  var present = {};
  for (var i = 0; i < 6; i++) present[benLq[i]] = true;
  var out = [];
  for (var j = 0; j < 6; j++) if (!present[sLq[j]]) out.push({ pos: j, liuqin: sLq[j], gan: sNj[j].gan, zhi: sNj[j].zhi });
  return out;
}
function computeCast(yao, dong){
  var g = yaoToGua(yao);
  var benKey = g.up * 10 + g.down;
  var ben = D.HEX[benKey];
  var bianYao = yao.slice();
  for (var i = 0; i < dong.length; i++) bianYao[dong[i]] = bianYao[dong[i]] === 1 ? 0 : 1;
  var bg = yaoToGua(bianYao);
  var bianKey = bg.up * 10 + bg.down;
  return {
    yao: yao, dong: dong, up: g.up, down: g.down,
    ben: ben, bian: D.HEX[bianKey], bianUp: bg.up, bianDown: bg.down, bianYao: bianYao
  };
}

/* ============ 四法 ============ */
function lenormandCalc(code, seed){
  var rnd = mulberry32(seed);
  var deck = [];
  for (var i = 0; i < 36; i++) deck.push(i);
  var picks = [];
  for (var j = 0; j < 3; j++){ var idx = rndInt(rnd, deck.length); picks.push(deck[idx]); deck.splice(idx, 1); }
  var score = 50, cards = [];
  for (var k = 0; k < 3; k++){
    var c = LENO[picks[k]];
    var pol = c[2], money = c[4];
    score += Math.round(pol * 30);
    if (pol > 0 && (money.indexOf('财运') >= 0 || money.indexOf('正财偏财') >= 0)) score += 5;
    if (pol < 0 && (money.indexOf('破财') >= 0 || money.indexOf('漏财') >= 0 || money.indexOf('被骗') >= 0)) score -= 5;
    cards.push({ pos: k + 1, name: c[1], pol: pol, kw: c[3], money: money });
  }
  score = Math.max(0, Math.min(100, score));
  var posName = {1:'第一张（事之始）',2:'第二张（事之中）',3:'第三张（事之果）'};
  var parts = cards.map(function(c){ return posName[c.pos] + '「' + c.name + '」——' + c.money; });
  return { cards: cards, score: score, verdict: verdict(score), text: parts.join('；') + '。' };
}
function tarotCalc(seed){
  var rnd = mulberry32(seed + 7);
  var deck = TAROT.slice();
  // Fisher-Yates（与 PHP shuffle 同构）
  for (var i = deck.length - 1; i > 0; i--){
    var j = rndInt(rnd, i + 1);
    var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
  }
  var picks = deck.slice(0, 3);
  var score = 50, out = [];
  var posName = ['过去', '现在', '未来'];
  for (var k = 0; k < 3; k++){
    var c = picks[k];
    var rev = rndInt(rnd, 100) < 40;
    var pol = c.pol;
    var eff = rev ? -pol * 0.6 : pol;
    score += Math.round(eff * 25);
    if (c.suit === 'pentacles') score += rev ? -5 : 8;
    out.push({ pos: posName[k], name: c.name, rev: rev, kw: c.kw, text: rev ? c.rev : c.up, pol: pol });
  }
  score = Math.max(0, Math.min(100, score));
  var parts = out.map(function(c){ return c.pos + '位「' + c.name + '」（' + (c.rev ? '逆位' : '正位') + '）：' + c.text; });
  return { cards: out, score: score, verdict: verdict(score), text: parts.join('；') + '。' };
}
function liuyaoCalc(code){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate(), h = now.getHours();

  var benNajia = guaNajia(cast.up, cast.down);
  var benLq = guaLiuqin(D.GONG_ELEM[cast.ben.g], cast.yao, benNajia);

  var score = 50, notes = [], positions = [];
  for (var i = 0; i < 6; i++) if (benLq[i] === '妻财') positions.push(i);
  var guaName = cast.ben.n;

      if (st.lv === 'wang'){ score += 15; notes.push('伏神旺相，根基仍在，可待时机出伏'); }
      else if (st.lv === 'shuai'){ score -= 15; notes.push('伏神休囚无力，财势暗弱'); }

      if (pp === ying - 1) s += 1;
      var nj0 = benNajia[pp];
      var st0 = elemStrength(D.ZHI_ELEM[nj0.zhi], monthElem, dayElem);
      if (st0.lv === 'wang') s += 1;

    }
    var nj = benNajia[main];
    var st = elemStrength(D.ZHI_ELEM[nj.zhi], monthElem, dayElem);
    var isKong = kong.indexOf(nj.zhi) >= 0;

    if (lv === 'wang') score += 20;
    else if (lv === 'shuai') score -= 15;
    if (isDong){ score += 15; notes.push('财爻发动，行情/资金有动作，应期较快'); }
    if (isShi){ score += 12; notes.push('财爻持世，财权在握，主动权在自己'); }

  }
  var xiongDong = [];
  for (var q = 0; q < 6; q++) if (benLq[q] === '兄弟' && cast.dong.indexOf(q) >= 0) xiongDong.push(D.YAO_CN[q]);
  if (xiongDong.length){ score -= 15; notes.push('兄弟爻（' + xiongDong.join('、') + '）发动，劫财夺利，谨防竞争、破费'); }

  score = Math.max(0, Math.min(100, score));
  return {
    gua: guaName,
    dong: dongYao.length ? dongYao.join('、') + '动' : '静卦',
    caicai: fsInfo,
    notes: notes,
    score: score,
    verdict: verdict(score),
    text: '得《' + guaName + '》卦' + dongText + '。' + notes.join('；') + '。'
  };
}

function q_jdFromYMD(y, m, d, h){
  if (m <= 2){ y -= 1; m += 12; }
  var A = Math.floor(y / 100);
  var B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5 + h / 24;
}
function q_sunLongitude(jd){
  var T = (jd - 2451545.0) / 36525;
  var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  var M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * Math.PI / 180;
  var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M)
        + (0.019993 - 0.000101 * T) * Math.sin(2 * M)
        + 0.000289 * Math.sin(3 * M);
  var lon = (L0 + C) % 360;
  if (lon < 0) lon += 360;
  return lon;
}
function q_findCrossing(angle, startMs, endMs){
  var step = 6 * 3600 * 1000;
  function jdMs(ms){ var dt = new Date(ms); var hh = dt.getHours() + dt.getMinutes() / 60 + dt.getSeconds() / 3600; return q_jdFromYMD(dt.getFullYear(), dt.getMonth() + 1, dt.getDate(), hh); }
  function sunUw(ms, refRaw){ var dd = q_sunLongitude(jdMs(ms)) - refRaw; if (dd > 180) dd -= 360; if (dd < -180) dd += 360; return refRaw + dd; }
  var refRaw = q_sunLongitude(jdMs(startMs));
  var prevMs = startMs, prevUw = sunUw(startMs, refRaw);
  var t = startMs + step;
  var want = angle % 360;
  if (want < 0) want += 360;
  while (t <= endMs){
    var uw = sunUw(t, refRaw);
    var a0 = Math.floor(prevUw / 15) * 15;
    var a1 = Math.floor(uw / 15) * 15;
    if (a1 > a0){
      var target = a0 + 15;
      if ((target % 360 === want) || (target === 360 && want === 0)){
        var lo = prevMs, hi = t;
        for (var i = 0; i < 90; i++){
          var mid = (lo + hi) / 2;
          var mUw = sunUw(mid, refRaw);
          if (mUw < target) lo = mid; else hi = mid;
        }
        return (lo + hi) / 2;
      }
    }
    prevMs = t; prevUw = uw; t += step;
  }
  return null;
}
function q_computeTerms(year){
  var res = [];
  var rough = {"小寒":[1,6],"大寒":[1,20],"立春":[2,4],"雨水":[2,19],"惊蛰":[3,6],"春分":[3,21],"清明":[4,5],"谷雨":[4,20],"立夏":[5,6],"小满":[5,21],"芒种":[6,6],"夏至":[6,21],"小暑":[7,7],"大暑":[7,23],"立秋":[8,8],"处暑":[8,23],"白露":[9,8],"秋分":[9,23],"寒露":[10,8],"霜降":[10,23],"立冬":[11,7],"小雪":[11,22],"大雪":[12,7],"冬至":[12,22]};
  var start = new Date(year - 1, 0, 1).getTime();
  var end = new Date(year + 1, 11, 31, 23).getTime();
  var half = 20 * 24 * 3600 * 1000;
  for (var i = 0; i < Q.TERM_NAMES.length; i++){
    var name = Q.TERM_NAMES[i];
    var angle = Q.TERM_ANGLES[name];
    var r = rough[name];
    var approx = new Date(year, r[0] - 1, r[1], 12).getTime();
    var s = Math.max(start, approx - half * 2);
    var e = Math.min(end, approx + half * 2);
    var t = q_findCrossing(angle, s, e);
    if (t !== null) res.push({ name: name, time: t });
  }
  return res;
}
function q_getCurrentTerm(ms){
  var year = new Date(ms).getFullYear();
  var terms = q_computeTerms(year);
  terms.sort(function(a, b){ return a.time - b.time; });
  var cur = null, next = null;
  for (var i = 0; i < terms.length; i++){ if (terms[i].time <= ms){ cur = terms[i]; next = terms[i + 1] || null; } }
  if (!cur) cur = terms[0];
  if (!next){
    var t2 = q_computeTerms(year + 1);
    t2.sort(function(a, b){ return a.time - b.time; });
    next = t2[0];
  }
  return { cur: cur, next: next };
}

function q_dayGZIndex(y, m, d){

  var wxSheng = {'木':'火','火':'土','土':'金','金':'水','水':'木'};
  var wxKe = {'木':'土','土':'水','水':'火','火':'金','金':'木'};
  var sWx = gongWx[stockGong] || '土';
  notes.push('股票落' + palaceName(stockGong) + '宫（' + sWx + '）');
  var svStock = vigorScore(stockGong);
  score += Math.round(svStock / 2);
  if (svStock > 0) notes.push('落宫' + vigorName(stockGong) + '，得时之气，走势底气较足');
  else if (svStock < 0) notes.push('落宫' + vigorName(stockGong) + '，失时之气，走势偏弱');
  if (shengGong){
    var mWx = gongWx[shengGong] || '土';
    if (stockGong === shengGong){ score += 25; notes.push('股票与生门同宫，财气临身，正合财局，为大吉之象'); }
    else if (wxSheng[mWx] === sWx){ score += 18; notes.push('生门（' + mWx + '）生股票宫（' + sWx + '），财来生我，进财得力'); }
    else if (wxSheng[sWx] === mWx){ score -= 8; notes.push('股票宫（' + sWx + '）生财门（' + mWx + '），我泄于财，财来财去、费劲难存'); }
    else if (wxKe[mWx] === sWx){ score -= 18; notes.push('财门（' + mWx + '）克股票宫（' + sWx + '），财来克身，得财费力且易伤本'); }
    else if (wxKe[sWx] === mWx){ score += 8; notes.push('股票宫（' + sWx + '）克财门（' + mWx + '），我克为财，费力可得、有掌控力'); }
  }
  for (var mi = 0; mi < chart.menpoRooms.length; mi++){ if (chart.menpoRooms[mi].p === stockGong){ score -= 12; notes.push('股票宫逢' + chart.menpoRooms[mi].msg + '，财位受克'); } }
  for (var mi2 = 0; mi2 < chart.muItems.length; mi2++){ if (chart.muItems[mi2].p === stockGong){ score -= 12; notes.push(chart.muItems[mi2].what + '，该股财气受阻'); } }
  for (var mi3 = 0; mi3 < chart.jixingItems.length; mi3++){ if (chart.jixingItems[mi3].p === stockGong){ score -= 10; notes.push('股票宫逢击刑（' + chart.jixingItems[mi3].gan + '），易生损耗'); } }
  for (var ki = 0; ki < chart.kwGong.length; ki++){ if (chart.kwGong[ki] === stockGong){ score -= 8; notes.push('股票落旬空之宫，眼下虚浮、方向未定'); } }

  for (var mp = 0; mp < chart.menpoRooms.length; mp++){ if (chart.menpoRooms[mp].p === shengGong || chart.menpoRooms[mp].p === wuGong){ score -= 15; notes.push('用神宫逢' + chart.menpoRooms[mp].msg + '，财路受克'); } }
  for (var gp = 0; gp < chart.gongpoRooms.length; gp++){ if (chart.gongpoRooms[gp].p === shengGong || chart.gongpoRooms[gp].p === wuGong){ score -= 8; notes.push('用神宫' + chart.gongpoRooms[gp].msg + '，博弈损耗'); } }
  for (var mu = 0; mu < chart.muItems.length; mu++){ if (chart.muItems[mu].p === wuGong || chart.muItems[mu].p === shengGong){ score -= 15; notes.push(chart.muItems[mu].what + '，资金被套/财气受阻'); } }
  for (var jx = 0; jx < chart.jixingItems.length; jx++){ if (chart.jixingItems[jx].gan === '戊'){ score -= 10; notes.push('戊逢击刑于' + palaceName(chart.jixingItems[jx].p) + '宫，资金易受损耗'); } }
  if (chart.juForm === '伏吟'){ score -= 12; notes.push('全局伏吟，事多阻滞、欲动难动，宜守不宜攻'); }
  else if (chart.juForm === '反吟'){ score -= 8; notes.push('全局反吟，局势反复、方向不定，慎勿追高'); }
  for (var kg = 0; kg < chart.kwGong.length; kg++){ if (chart.kwGong[kg] === wuGong){ score -= 10; notes.push('戊落旬空之宫，资本虚浮、眼下难落实'); } }

  score = Math.max(0, Math.min(100, score));
  var siZhu = chart.siZhu.map(function(v){ return v[0]; }).join(' ');
  return {
    ju: chart.ju + '局',
    siZhu: siZhu,
    xun: chart.xunName,
    juForm: chart.juForm || '正常',
    zhiFu: chart.zhiFuStar + '·' + chart.zhiShiDoor,
    notes: notes,
    score: score,
    verdict: verdict(score),
    text: '时家奇门' + chart.ju + '局（' + (chart.juForm || '无伏吟反吟') + '），四柱：' + siZhu + '。' + notes.join('；') + '。'
  };
}

/* ============ 综合 ============ */
function verdict(score){
  if (score >= 70) return '吉';
  if (score >= 55) return '偏吉';
  if (score >= 40) return '中性';
  return '凶';
}
function level(total){
  if (total >= 70) return '积极（宜买）';
  if (total >= 55) return '谨慎偏多（可轻仓）';
  if (total >= 40) return '观望（不追高）';
  return '回避（不宜买）';
}
function advice(total){
  if (total >= 70) return '综合四法皆顺，倾向积极：可考虑买入或加仓，持有为主，回踩不破关键支撑可继续持有。';
  if (total >= 55) return '总体偏吉但存在变数：可轻仓试探，不宜一次性重仓；已持有者持股观察，逢明显冲高可先落袋一部分。';
  if (total >= 40) return '吉凶参半、方向未明：以观望为主，不追高、不加仓；已持有者可继续持有观察，破位再考虑减仓。';
  return '综合四法多示警，倾向回避：不建议买入；已持有者宜逢反弹减仓，控制风险为先。';
}
function oracle(code){
  code = code.toUpperCase().trim();
  if (!/^[A-Z0-9.\-]{1,20}$/.test(code)) return { ok:false, msg:'股票代码格式不正确，请填写如 600519、000001、00700 等代码' };
  var now = new Date();
  var dateStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  var seed = crc32(code + '|' + dateStr);
  var L = lenormandCalc(code, seed);
  var T = tarotCalc(seed);
  var LY = liuyaoCalc(code);
  var QM = qimenCalc(code);
  var total = Math.round(L.score * 0.2 + T.score * 0.2 + LY.score * 0.3 + QM.score * 0.3);
  total = Math.max(0, Math.min(100, total));
  return {
    ok: true, code: code, date: dateStr,
    time: pad(now.getHours()) + ':' + pad(now.getMinutes()),
    modules: { lenormand: L, tarot: T, liuyao: LY, qimen: QM },
    total: total, level: level(total), advice: advice(total)
  };
}

/* ============ 渲染 ============ */
function badge(v){
  var cls = v === '吉' ? 'ji' : (v === '偏吉' ? 'pianji' : (v === '中性' ? 'zhong' : 'xiong'));
  return '<span class="badge ' + cls + '">' + v + '</span>';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function notesHtml(arr){ return '<ul class="note-list">' + arr.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>'; }
function scoreLine(v){ return '<div class="score-line"><i style="width:' + v + '%"></i></div>'; }
function render(M){
  var grid = document.getElementById('grid');
  var h = [];
  var ML = M.modules;
  // 雷诺曼
  h.push('<div class="mcard"><div class="mcard-head"><div class="mcard-title">雷诺曼<small>三张牌阵</small></div>' + badge(ML.lenormand.verdict) + '</div>' + scoreLine(ML.lenormand.score));
  h.push('<div>' + ML.lenormand.cards.map(function(c){ return '<span class="tag">' + esc(c.name) + '</span>'; }).join('') + '</div>');
  h.push(notesHtml(ML.lenormand.cards.map(function(c){ return '第' + c.pos + '张「' + c.name + '」——' + c.money; })) + '</div>');
  // 塔罗
  h.push('<div class="mcard"><div class="mcard-head"><div class="mcard-title">塔罗<small>过去·现在·未来</small></div>' + badge(ML.tarot.verdict) + '</div>' + scoreLine(ML.tarot.score));
  h.push('<div>' + ML.tarot.cards.map(function(c){ return '<span class="tag">' + esc(c.name) + (c.rev ? '·逆' : '') + '</span>'; }).join('') + '</div>');
  h.push(notesHtml(ML.tarot.cards.map(function(c){ return c.pos + '位「' + c.name + '」（' + (c.rev ? '逆位' : '正位') + '）：' + c.text; })) + '</div>');
  // 六爻
  h.push('<div class="mcard"><div class="mcard-head"><div class="mcard-title">六爻<small>时念起卦 · 妻财为用</small></div>' + badge(ML.liuyao.verdict) + '</div>' + scoreLine(ML.liuyao.score));
  h.push('<div><span class="tag">' + esc(ML.liuyao.gua) + '</span><span class="tag">' + esc(ML.liuyao.dong) + '</span><span class="tag">妻财：' + esc(ML.liuyao.caicai) + '</span></div>');
  h.push(notesHtml(ML.liuyao.notes) + '</div>');
  // 奇门
  h.push('<div class="mcard"><div class="mcard-head"><div class="mcard-title">奇门<small>时家奇门 · 股票落宫参断</small></div>' + badge(ML.qimen.verdict) + '</div>' + scoreLine(ML.qimen.score));
  h.push('<div><span class="tag">' + esc(ML.qimen.ju) + '</span><span class="tag">' + esc(ML.qimen.siZhu) + '</span><span class="tag">' + esc(ML.qimen.xun) + '</span><span class="tag">' + esc(ML.qimen.zhiFu) + '</span></div>');
  h.push(notesHtml(ML.qimen.notes) + '</div>');
  grid.innerHTML = h.join('');

  // 综合环
  var total = M.total;
  var circ = 2 * Math.PI * 44;
  var ring = document.getElementById('ring');
  ring.innerHTML = '<svg width="110" height="110"><circle cx="55" cy="55" r="44" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="9"/><circle cx="55" cy="55" r="44" fill="none" stroke="#e3c184" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (circ * total / 100) + ' ' + circ + '"/></svg>' +
    '<div class="num"><b>' + total + '</b><span>综合分</span></div>';
  document.getElementById('t-level').textContent = M.level;
  document.getElementById('t-advice').textContent = M.advice;
  var names = { lenormand: '雷诺曼', tarot: '塔罗', liuyao: '六爻', qimen: '奇门' };
  var order = ['lenormand','tarot','liuyao','qimen'].sort(function(a,b){ return M.modules[b].score - M.modules[a].score; });
  document.getElementById('t-rank').textContent = '四法强弱：' + order.map(function(k){ return names[k] + verdict(M.modules[k].score) + '（' + M.modules[k].score + '分）'; }).join('、');
}
document.getElementById('go').addEventListener('click', function(){
  var code = document.getElementById('code').value.trim();
  if (!code){ alert('请输入股票代码'); return; }
  var r = oracle(code);
  if (!r.ok){ alert(r.msg); return; }
  document.getElementById('result').classList.add('show');
  render(r);
  document.getElementById('result').scrollIntoView({ behavior:'smooth', block:'start' });
});
document.getElementById('code').addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('go').click();
});
</script>
